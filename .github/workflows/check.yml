name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
      cli_only: ${{ steps.scope.outputs.cli_only }}
      skill_changed: ${{ steps.scope.outputs.skill_changed }}
      package_checks: ${{ steps.scope.outputs.package_checks }}
      node_all: ${{ steps.scope.outputs.node_all }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-scope.sh
      - run: node --test scripts/test-ci-scope.mjs scripts/test-native-helper-artifact.mjs
      - name: Check release entry points before preparation
        run: npm run check:release:entry
      - id: matrix
        env:
          BROWSER: ${{ steps.scope.outputs.browser }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == push || "$BROWSER" == true ]]; then
            echo 'matrix={"project":["core","renderer","integration","browser"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"project":["core","renderer","integration"]}' >> "$GITHUB_OUTPUT"
          fi

  changed-quality:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check changed formatting and source lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsonc' '*.jsx' '*.md' '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml')
          if (( ${#files[@]} )); then
            npx dprint check --allow-no-files -- "${files[@]}"
          fi
          npm run lint:staged -- --diff "$BASE_SHA...$HEAD_SHA"

  prepare:
    if: github.event_name == 'push' || needs.scope.outputs.docs_only != 'true' || needs.scope.outputs.skill_changed == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Git runtime dependencies require their prepare scripts; do this once.
      - run: npm ci
      - name: Build the selected workspace closure
        env:
          FULL: ${{ needs.scope.outputs.full }}
          CLI_ONLY: ${{ needs.scope.outputs.cli_only }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request && "$FULL" != true && "$CLI_ONLY" == true ]]; then
            npm run build --workspace=cordisx
          else
            npm run build
          fi
      - run: node --test scripts/test-test-projects.mjs
      - name: Archive prepared dependencies and outputs
        run: |
          find node_modules packages -type d \( -name node_modules -o -name dist \) -prune -print0 > "$RUNNER_TEMP/prepared-paths"
          tar -czf "$RUNNER_TEMP/host.tgz" --null -T "$RUNNER_TEMP/prepared-paths"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-host
          path: ${{ runner.temp }}/host.tgz
          overwrite: true
          compression-level: 0
          retention-days: 1

  native-helpers:
    if: github.event_name == 'push' || needs.scope.outputs.full == 'true' || needs.scope.outputs.package_checks == 'true' || needs.scope.outputs.skill_changed == 'true'
    needs: scope
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and verify universal native helpers from the exact candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node packages/cli/scripts/native-helper-artifact.mjs build --source-commit "$HEAD_SHA"
          node packages/cli/scripts/native-helper-artifact.mjs verify --source-commit "$HEAD_SHA"
          tar -czf "$RUNNER_TEMP/native-helpers.tgz" -C packages/cli dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-helpers-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-helpers.tgz
          overwrite: true
          compression-level: 0
          retention-days: 1

  typecheck:
    if: github.event_name == 'push' || needs.scope.outputs.docs_only != 'true'
    needs: [scope, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/restore-prepared-host
      - run: npm run typecheck

  tests:
    if: github.event_name == 'push' || needs.scope.outputs.docs_only != 'true'
    needs: [scope, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/restore-prepared-host
      - name: Require Chrome only for the browser group
        if: matrix.project == 'browser'
        run: |
          chrome=$(command -v google-chrome || command -v chromium)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          echo "RESTRICTED_CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Run the selected test group
        env:
          PROJECT: ${{ matrix.project }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.scope.outputs.full }}
          NODE_ALL: ${{ needs.scope.outputs.node_all }}
        run: |
          args=(run --project "$PROJECT" --reporter=default --reporter=json --outputFile=test-result.json)
          # Browser selection includes dynamic bundler paths that --changed cannot discover.
          if [[ "$EVENT" == pull_request && "$FULL" != true && "$NODE_ALL" != true && "$PROJECT" != browser ]]; then
            args+=(--changed "$BASE_SHA" --passWithNoTests)
          fi
          npx --no-install vitest "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-result-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-result.json
          if-no-files-found: warn

  package:
    if: github.event_name == 'push' || needs.scope.outputs.full == 'true' || needs.scope.outputs.package_checks == 'true' || needs.scope.outputs.skill_changed == 'true'
    needs: [scope, prepare, native-helpers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/restore-prepared-host
      - uses: actions/download-artifact@v4
        with:
          name: native-helpers-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-helpers
      - name: Bind native helpers to the exact package candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tar -xzf "$RUNNER_TEMP/native-helpers/native-helpers.tgz" -C packages/cli
          node packages/cli/scripts/native-helper-artifact.mjs verify --source-commit "$HEAD_SHA"
      - run: npm install --global npm@11.11.0 --registry=https://registry.npmjs.org
      - run: npm run check:release
      - run: npm run check:package
      - name: Pack the exact Host and Creator release packages
        run: node scripts/ci-release-candidate.mjs pack --directory .release-cache/release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-cache/release-packages
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: 30

  installed:
    if: github.event_name == 'push' || needs.scope.outputs.full == 'true'
    needs: [scope, prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/restore-prepared-host
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-cache/release-packages
      - name: Bind installation checks to the exact candidate
        run: |
          version=$(node -p "require('./package.json').version")
          cordisx="$GITHUB_WORKSPACE/.release-cache/release-packages/cordisx-$version.tgz"
          creator="$GITHUB_WORKSPACE/.release-cache/release-packages/create-cordisx-plugin-$version.tgz"
          test -f "$cordisx"
          test -f "$creator"
          echo "CORDISX_TARBALL=$cordisx" >> "$GITHUB_ENV"
          echo "CORDISX_CREATOR_TARBALL=$creator" >> "$GITHUB_ENV"
      - run: npm run check:clean-dev
      - run: npm run check:installed

  full:
    # Stable aggregate status: a failed/cancelled prerequisite cannot appear green.
    if: ${{ !cancelled() && always() }}
    needs: [scope, changed-quality, prepare, native-helpers, typecheck, tests, package, installed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: needs.package.result == 'success'
        with:
          name: release-packages-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-cache/release-packages
      - id: outcomes
        name: Check selected gate outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
          echo "### Host checks for $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
      - id: review
        name: Record review evidence for the exact commit
        if: needs.package.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=BYPASSED
          actor="$GITHUB_ACTOR"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA"
          reason="direct main push admitted by repository policy"
          if [[ "$EVENT" == pull_request ]]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
            reason="pull request validation candidate; tag publication accepts push candidates only"
          else
            pulls=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")
            pr_number=$(jq -r '[.[] | select(.merged_at != null)] | first.number // empty' <<< "$pulls")
            if [[ -n "$pr_number" ]]; then
              review=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json reviewDecision,reviews,url)
              url=$(jq -r '.url' <<< "$review")
              if [[ $(jq -r '.reviewDecision' <<< "$review") == APPROVED ]]; then
                status=APPROVED
                actor=$(jq -r '[.reviews[] | select(.state == "APPROVED")] | last.author.login' <<< "$review")
                reason=
              else
                reason="merged pull request admitted without a current APPROVED review decision"
              fi
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Create and verify the canonical release candidate
        if: needs.package.result == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_STATUS: ${{ steps.review.outputs.status }}
          REVIEW_ACTOR: ${{ steps.review.outputs.actor }}
          REVIEW_URL: ${{ steps.review.outputs.url }}
          REVIEW_REASON: ${{ steps.review.outputs.reason }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          node scripts/ci-release-candidate.mjs create \
            --directory .release-cache --commit "$HEAD_SHA" --repository "$GITHUB_REPOSITORY" --tag "$tag" \
            --ci-name "Check / selected gates" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --review-status "$REVIEW_STATUS" --review-actor "$REVIEW_ACTOR" \
            --review-url "$REVIEW_URL" --review-reason "$REVIEW_REASON"
          node scripts/ci-release-candidate.mjs verify \
            --directory .release-cache --commit "$HEAD_SHA" --repository "$GITHUB_REPOSITORY" --tag "$tag"
      - uses: actions/upload-artifact@v4
        if: needs.package.result == 'success'
        with:
          name: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-cache
          include-hidden-files: true
          overwrite: true
          compression-level: 0
          retention-days: 30
      - name: Record aggregate evidence
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RESULT: ${{ steps.outcomes.outcome }}
          FULL_GATE: ${{ github.event_name == 'push' || needs.scope.outputs.full == 'true' }}
          GROUPS: ${{ needs.scope.outputs.matrix }}
          OUTCOMES: ${{ toJSON(needs) }}
        run: |
          mkdir -p .ci-results
          test -n "$GROUPS" || GROUPS='{}'
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v4' \
            --arg environment 'github-hosted/ubuntu-latest/node22' --argjson fullGate "$FULL_GATE" \
            --argjson groups "$GROUPS" --argjson outcomes "$OUTCOMES" \
            --arg result "$RESULT" --arg evidenceUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:(if $fullGate and (($groups.project // []) | index("browser") != null) then "full" else "affected" end),environment:$environment,groups:$groups,outcomes:$outcomes,job:"full",result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/full.json
