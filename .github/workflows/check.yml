name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      style_only: ${{ steps.scope.outputs.style_only }}
      full: ${{ steps.scope.outputs.full }}
      cli_only: ${{ steps.scope.outputs.cli_only }}
      skill_changed: ${{ steps.scope.outputs.skill_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify the base/head diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-scope.sh
      - name: Check scope regression cases
        run: node --test scripts/ci-scope.test.mjs

  full:
    if: always() && (github.event_name == 'push' || needs.scope.result != 'success' || needs.scope.outputs.full == 'true')
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep the same order and commands as npm run check, with visible timings.
      - name: Verify clean development setup
        run: npm run check:clean-dev
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build all workspaces
        run: npm run build
      - name: Run the full test suite
        run: npm test
      - name: Verify release metadata
        run: npm run check:release
      - name: Verify package contents
        run: npm run check:package
      - name: Verify installed packages
        run: npm run check:installed
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLASSIFICATION: ${{ github.event_name == 'pull_request' && 'full' || 'main' }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification "$CLASSIFICATION" --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/full.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/full.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/full.json
          if-no-files-found: warn

  skill-package:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.skill_changed == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the CLI and its dependency closure
        run: npm run build --workspace=cordisx
      - name: Verify shipped Skill contents and deployment from the tarball
        run: npm run check:package --workspace=cordisx
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification 'skill-package' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/skill-package.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/skill-package.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/skill-package.json
          if-no-files-found: warn

  changed-quality:
    if: github.event_name == 'pull_request'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install without lifecycle builds
        run: npm ci --ignore-scripts
      - name: Check changed formatting and source lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsonc' '*.jsx' '*.md' '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml')
          if (( ${#files[@]} )); then
            npx dprint check --allow-no-files -- "${files[@]}"
          fi
          npm run lint:staged -- --diff "$BASE_SHA...$HEAD_SHA"
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification 'changed-quality' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/quality.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/quality.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/quality.json
          if-no-files-found: warn

  changed-typecheck:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck the workspace graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLI_ONLY: ${{ needs.scope.outputs.cli_only }}
        run: |
          if [[ "$CLI_ONLY" == 'true' ]]; then
            npm run typecheck --workspace=cordisx
          else
            npm run typecheck
          fi
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification 'changed-typecheck' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/typecheck.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/typecheck.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/typecheck.json
          if-no-files-found: warn

  changed-build:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all affected workspaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLI_ONLY: ${{ needs.scope.outputs.cli_only }}
        run: |
          if [[ "$CLI_ONLY" == 'true' ]]; then
            npm run build --workspace=cordisx
          else
            npm run build
          fi
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification 'changed-build' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/build.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/build.json
          if-no-files-found: warn

  changed-tests:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Runtime tests load the Git Channel/CLIProxy dependencies built by prepare.
      - run: npm ci
      - name: Run Vitest dependency-affected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run build --workspace=cordisx
          npx vitest run --changed "$BASE_SHA" --passWithNoTests --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v3' \
            --arg classification 'changed-tests' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/tests.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/tests.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/tests.json
          if-no-files-found: warn
