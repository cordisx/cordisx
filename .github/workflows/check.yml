name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      style_only: ${{ steps.scope.outputs.style_only }}
      full: ${{ steps.scope.outputs.full }}
      cli_only: ${{ steps.scope.outputs.cli_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify the base/head diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          style_only=true
          full=false
          cli_only=true
          while IFS= read -r file; do
            case "$file" in
              *.md|*.markdown) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              *.css|*.md|*.markdown) ;;
              *) style_only=false ;;
            esac
            case "$file" in
              packages/cli/src/*|tests/*|*.md|*.markdown) ;;
              *) cli_only=false ;;
            esac
            case "$file" in
              AGENTS.md|CONTRIBUTING.md|.agents/*|package.json|package-lock.json|.npmrc|.github/*|scripts/*|config/*|cordisx.config.*|packages/*/package.json|packages/channel-runtime/*|packages/cli/scripts/*|packages/cli/src/adapters/*|packages/cli/src/cli/*|packages/cli/src/config/*|packages/cli/src/launcher/*|packages/cli/src/providers/*|packages/cli/src/renderer/adapter*|packages/cli/src/contracts.ts|packages/cli/src/react.ts|packages/cli/src/react-jsx-*|packages/cli/src/ui.ts|packages/cli/src/vite.ts|packages/cli/src/*contract*|packages/cli/src/*permission*|packages/cli/src/*document*|packages/cli/src/*store*|packages/cli/src/*lifecycle*|packages/cli/src/*session*|packages/cli/src/*transport*|packages/cli/src/*connector*|packages/cli/src/*channel*)
                full=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          test -s "$RUNNER_TEMP/changed-files" || full=true
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "style_only=$style_only" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "cli_only=$cli_only" >> "$GITHUB_OUTPUT"
          {
            echo '### Host pull-request scope'
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- docs-only: \`$docs_only\`"
            echo "- style-only: \`$style_only\`"
            echo "- full gate: \`$full\`"
            echo "- CLI dependency closure only: \`$cli_only\`"
            echo '- changed files:'
            sed 's/^/  - `/' "$RUNNER_TEMP/changed-files" | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    if: always() && (github.event_name == 'push' || needs.scope.outputs.full == 'true')
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the complete owner gate
        run: npm run check
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLASSIFICATION: ${{ github.event_name == 'pull_request' && 'full' || 'main' }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v2' \
            --arg classification "$CLASSIFICATION" --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/full.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/full.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/full.json
          if-no-files-found: warn

  changed-quality:
    if: github.event_name == 'pull_request'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install without lifecycle builds
        run: npm ci --ignore-scripts
      - name: Check changed formatting and source lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.cjs' '*.css' '*.html' '*.js' '*.json' '*.jsonc' '*.jsx' '*.md' '*.mjs' '*.scss' '*.ts' '*.tsx' '*.yaml' '*.yml')
          if (( ${#files[@]} )); then
            npx dprint check --allow-no-files -- "${files[@]}"
          fi
          npm run lint:staged -- --diff "$BASE_SHA...$HEAD_SHA"
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v2' \
            --arg classification 'changed-quality' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/quality.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/quality.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/quality.json
          if-no-files-found: warn

  changed-typecheck:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck the workspace graph
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLI_ONLY: ${{ needs.scope.outputs.cli_only }}
        run: |
          if [[ "$CLI_ONLY" == 'true' ]]; then
            npm run typecheck --workspace=cordisx
          else
            npm run typecheck
          fi
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v2' \
            --arg classification 'changed-typecheck' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/typecheck.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/typecheck.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/typecheck.json
          if-no-files-found: warn

  changed-build:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all affected workspaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLI_ONLY: ${{ needs.scope.outputs.cli_only }}
        run: |
          if [[ "$CLI_ONLY" == 'true' ]]; then
            npm run build --workspace=cordisx
          else
            npm run build
          fi
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v2' \
            --arg classification 'changed-build' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/build.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/build.json
          if-no-files-found: warn

  changed-tests:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run Vitest dependency-affected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run build --workspace=@cordisx/channel-runtime
          npm run build --workspace=@cordisx/schemastery-ui
          npx vitest run --changed "$BASE_SHA" --passWithNoTests --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=30000
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'host-check-v2' \
            --arg classification 'changed-tests' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/tests.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/tests.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/tests.json
          if-no-files-found: warn
