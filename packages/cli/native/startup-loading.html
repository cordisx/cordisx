<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
    <title>CordisX</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { --surface: #f4f5f7; --text: #202124; --muted: #65676b; --error: #b42318; display: grid; place-items: center; background: var(--surface); color: var(--text); }
      main { display: grid; justify-items: center; gap: 16px; padding: 32px; text-align: center; user-select: none; }
      h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.7px; }
      p { margin: 0; max-width: 440px; color: var(--muted); font-size: 15px; line-height: 1.6; }
      .spinner { width: 22px; height: 22px; border: 2px solid color-mix(in srgb, currentColor 18%, transparent); border-top-color: currentColor; border-radius: 50%; animation: spin .9s linear infinite; }
      body[data-state="failed"] .spinner { display: none; }
      body[data-state="failed"] #message { color: var(--error); }
      #hint { font-size: 13px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { --surface: #17181a; --text: #f2f3f5; --muted: #a7aab0; --error: #ffb4ab; }
      }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; opacity: .6; } }
    </style>
  </head>
  <body data-state="loading">
    <main role="status" aria-live="polite">
      <h1>CordisX</h1>
      <p id="message">正在准备 ChatGPT 与 CordisX</p>
      <div class="spinner" aria-hidden="true"></div>
      <p id="hint">准备完成后，将在当前窗口继续</p>
    </main>
  </body>
</html>
